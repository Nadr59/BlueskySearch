name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # ✅ تحميل بيانات اللغة العربية والإنجليزية لـ Tesseract
      - name: Download Tesseract trained data
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -L -o app/src/main/assets/tessdata/ara.traineddata \
            "https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata"
          curl -L -o app/src/main/assets/tessdata/eng.traineddata \
            "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata"
          ls -la app/src/main/assets/tessdata/

      - name: Clean Build
        run: gradle clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OCRScreenCapture-debug
          path: app/build/outputs/apk/debug/app-debug.apk
